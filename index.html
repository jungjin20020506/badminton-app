<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- ===== 검색 노출(SEO) ===== -->
    <title>셔틀몬스터 — 도트 배드민턴 RPG</title>
    <meta
      name="description"
      content="셔틀몬스터는 포켓몬스터 감성의 2D 도트 배드민턴 RPG입니다. 셔틀타운을 걸어 다니며 주민과 대화하고, 셔틀마트에서 라켓을 사고, 체육관 관장에게 도전해 경기를 잡으세요. 설치 없이 휴대폰 브라우저에서 바로 실행됩니다."
    />
    <meta name="keywords" content="셔틀몬스터, 배드민턴 게임, 도트 게임, 픽셀 RPG, 배드민턴 매칭, 배드민턴 클럽 앱, 콕스타, 2D 배드민턴, 포켓몬 스타일" />
    <meta name="author" content="셔틀몬스터" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://shuttle-village.vercel.app/" />

    <!-- 카카오톡·페이스북 공유 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="셔틀몬스터" />
    <meta property="og:title" content="셔틀몬스터 — 도트 배드민턴 RPG" />
    <meta property="og:description" content="셔틀타운을 걸어 다니고, NPC와 대화하고, 체육관에서 경기를 잡는다. 설치 없이 휴대폰에서 바로." />
    <meta property="og:image" content="https://shuttle-village.vercel.app/og-image.png" />
    <meta property="og:url" content="https://shuttle-village.vercel.app/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="셔틀몬스터 — 도트 배드민턴 RPG" />
    <meta name="twitter:description" content="포켓몬스터 감성으로 즐기는 2D 배드민턴 마을 게임" />
    <meta name="twitter:image" content="https://shuttle-village.vercel.app/og-image.png" />

    <!-- 구글이 게임으로 인식하도록 구조화 데이터 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "셔틀몬스터",
        "alternateName": ["ShuttleMonster", "셔틀 몬스터", "셔틀빌리지"],
        "url": "https://shuttle-village.vercel.app/",
        "image": "https://shuttle-village.vercel.app/og-image.png",
        "description": "포켓몬스터 감성의 2D 도트 배드민턴 RPG. 마을 탐험, NPC 대화, 상점, 캐릭터 커스터마이징, 자동 매칭과 코트 운영을 즐길 수 있습니다.",
        "inLanguage": "ko",
        "genre": ["롤플레잉", "스포츠", "시뮬레이션", "캐주얼"],
        "gamePlatform": ["Web browser", "Android", "iOS"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>

    <!-- ===== 홈 화면에 추가(PWA) ===== -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2a3550" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="셔틀몬스터" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
